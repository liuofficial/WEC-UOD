
nc: 10 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'

  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]]      # 1-P2/4

  # Stage 2
  - [-1, 1, UWECSP, [256, 1, 0.5, True, False, 0.03, True, True, 16]]

  - [-1, 1, Conv,  [256, 3, 2]]      # 3-P3/8

  # Stage 3
  - [-1, 1, UWECSP, [512, 1, 0.5, True, False, 0.03, True, True, 16]]

  - [-1, 1, Conv,  [512, 3, 2]]      # 5-P4/16

  # Stage 4
  - [-1, 1, UWECSP, [512, 2, 0.5, True, True, 0.05, True, True, 16]]

  - [-1, 1, Conv,  [1024, 3, 2]]     # 7-P5/32

  # Stage 5
  - [-1, 1, UWECSP, [1024, 2, 0.5, True, True, 0.06, True, True, 16]]

  - [-1, 1, SPPF,   [1024, 5]]
  - [-1, 1, C2PSA,  [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2,PDPMC3K2Clean, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, PDPMC3K2Clean, [256]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2,PDPMC3K2Clean, [512]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, PDPMC3K2Clean, [1024]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
